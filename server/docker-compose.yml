services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: littleiran
      POSTGRES_PASSWORD: littleiran
      POSTGRES_DB: littleiran
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql

volumes:
  pgdata:
